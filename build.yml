name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. تخزين مؤقت لـ Gradle لتسريع البناء
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. منح صلاحية التنفيذ لـ gradlew
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5. التحقق من صحة الـ wrapper
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      # 6. بناء Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 7. رفع الـ APK كـ Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-keyboard-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release:
    name: Release APK on Tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-unsigned.apk
          name: "Arabic Keyboard ${{ github.ref_name }}"
          body: |
            ## لوحة مفاتيح عربية ${{ github.ref_name }}

            ### التثبيت
            1. حمّل الـ APK
            2. فعّل «تثبيت من مصادر غير معروفة» في إعدادات هاتفك
            3. ثبّت الـ APK وافتح التطبيق
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
