name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. منح صلاحيات التنفيذ لـ gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. بناء الـ APK (Debug)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 5. رفع الـ APK كـ Artifact قابل للتحميل
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-keyboard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release:
    name: Build & Release APK (on tag)
    runs-on: ubuntu-latest
    # يعمل فقط عند إنشاء Git tag مثل v1.0.0
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # بناء Release APK (غير موقَّع)
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # نشر APK في GitHub Releases تلقائياً
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-unsigned.apk
          name: "Arabic Keyboard ${{ github.ref_name }}"
          body: |
            ## لوحة مفاتيح عربية ${{ github.ref_name }}

            ### التثبيت
            1. حمّل ملف APK
            2. فعّل "تثبيت من مصادر غير معروفة" في إعدادات هاتفك
            3. ثبّت الـ APK
            4. افتح التطبيق واتبع خطوات التفعيل
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
